<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプル・モグラ叩き</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hole {
            background: #4b3621;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 0 rgba(0,0,0,0.3);
        }
        .mole {
            width: 100%;
            height: 100%;
            background-color: #8b4513;
            border-radius: 50% 50% 0 0;
            position: absolute;
            top: 100%;
            transition: top 0.1s ease-out;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            user-select: none;
        }
        .mole.up {
            top: 10%;
        }
        .mole::after {
            content: '● ●';
            color: black;
            font-size: 0.8rem;
            position: absolute;
            top: 20%;
        }
        .mole::before {
            content: '◡';
            color: pink;
            font-size: 1.2rem;
            position: absolute;
            top: 35%;
        }
        .hit-effect {
            animation: hit 0.2s ease-out;
        }
        @keyframes hit {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); background-color: #ff4d4d; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-green-100 min-h-screen flex flex-col items-center justify-center font-sans">

    <div class="max-w-md w-full p-4">
        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold text-green-800 mb-2">モグラ叩き</h1>
            <div class="flex justify-around bg-white p-4 rounded-xl shadow-md text-xl font-bold">
                <p>スコア: <span id="score" class="text-red-500">0</span></p>
                <p>残り時間: <span id="timer" class="text-blue-500">30</span>s</p>
            </div>
        </div>

        <!-- 3x3 Grid of Holes -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="hole aspect-square"><div class="mole"></div></div>
            <div class="hole aspect-square"><div class="mole"></div></div>
            <div class="hole aspect-square"><div class="mole"></div></div>
            <div class="hole aspect-square"><div class="mole"></div></div>
            <div class="hole aspect-square"><div class="mole"></div></div>
            <div class="hole aspect-square"><div class="mole"></div></div>
            <div class="hole aspect-square"><div class="mole"></div></div>
            <div class="hole aspect-square"><div class="mole"></div></div>
            <div class="hole aspect-square"><div class="mole"></div></div>
        </div>

        <div id="controls" class="text-center">
            <button id="start-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-full text-xl transition shadow-lg transform active:scale-95">
                ゲーム開始
            </button>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl">
            <h2 class="text-3xl font-bold mb-4 text-green-700">終了！</h2>
            <p class="text-xl mb-6">あなたのスコアは <span id="final-score" class="font-bold text-2xl text-red-500">0</span> 点でした！</p>
            <button id="restart-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg w-full transition">
                もう一度遊ぶ
            </button>
        </div>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const scoreBoard = document.querySelector('#score');
        const timerDisplay = document.querySelector('#timer');
        const startBtn = document.querySelector('#start-btn');
        const modal = document.querySelector('#modal');
        const finalScoreDisplay = document.querySelector('#final-score');
        const restartBtn = document.querySelector('#restart-btn');

        let lastHole;
        let timeUp = false;
        let score = 0;
        let timeLeft = 30;
        let timerId;

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        function peep() {
            // スコアに応じてスピードを上げる
            const minTime = Math.max(200, 800 - (score * 15));
            const maxTime = Math.max(500, 1500 - (score * 20));
            
            const time = randomTime(minTime, maxTime);
            const hole = randomHole(holes);
            const mole = hole.querySelector('.mole');
            
            mole.classList.add('up');
            
            setTimeout(() => {
                mole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            scoreBoard.textContent = 0;
            timeUp = false;
            startBtn.classList.add('hidden');
            
            countdown();
            peep();
            
            timerId = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function countdown() {
            timerDisplay.textContent = timeLeft;
        }

        function endGame() {
            timeUp = true;
            clearInterval(timerId);
            finalScoreDisplay.textContent = score;
            modal.classList.remove('hidden');
            startBtn.classList.remove('hidden');
        }

        function bonk(e) {
            if(!e.isTrusted) return; // チート対策
            if(!this.classList.contains('up')) return; // 出てないときは無効
            
            score++;
            this.classList.remove('up');
            this.classList.add('hit-effect');
            
            // ヒット時の演出（少し遅らせてクラス削除）
            setTimeout(() => this.classList.remove('hit-effect'), 200);
            
            scoreBoard.textContent = score;
        }

        moles.forEach(mole => mole.addEventListener('click', bonk));
        
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
            startGame();
        });

    </script>
</body>
</html>
